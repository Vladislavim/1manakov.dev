# Include inside an HTTPS server block with root pointing to extracted files.
# Configure TLS and the HTTP/www -> https://imanakov.dev redirects in the host panel.
index index.html;
error_page 404 /404.html;
location = /play { return 301 /lab; }
location = /play/ { return 301 /lab; }
location = /journal { return 301 /guides; }
location /journal/ { rewrite ^/journal/(.*)$ /guides/$1 permanent; }
location /sitemaps/ {
    default_type application/xml;
    try_files $uri =404;
}
location / {
    try_files $uri $uri.html $uri/index.html =404;
}
location ~ /\. { deny all; }
